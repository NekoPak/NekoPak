[workspace]
resolver = "2"
members = [
  "crates/nekopak-domain",
  "crates/nekopak-provider",
  "crates/nekopak-provider-mock",
  "crates/nekopak-provider-native",
  "crates/nekopak-media",
  "crates/nekopak-mount",
  "crates/nekopak-core",
  "src-tauri",
]
default-members = [
  "crates/nekopak-domain",
  "crates/nekopak-provider",
  "crates/nekopak-provider-mock",
  "crates/nekopak-provider-native",
  "crates/nekopak-media",
  "crates/nekopak-core",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
nekopak-domain = { path = "crates/nekopak-domain" }
nekopak-provider = { path = "crates/nekopak-provider" }
nekopak-provider-mock = { path = "crates/nekopak-provider-mock" }
nekopak-provider-native = { path = "crates/nekopak-provider-native" }
nekopak-core = { path = "crates/nekopak-core" }
nekopak-media = { path = "crates/nekopak-media" }
nekopak-mount = { path = "crates/nekopak-mount" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
sha2 = "0.10"
url = "2"
zeroize = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

