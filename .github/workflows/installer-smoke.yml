name: Windows installer smoke
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Signed desktop release run ID to test
        required: true
  workflow_run:
    workflows: ['Signed desktop release']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  install-uninstall:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.1
      - name: Fetch and verify the signed release artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          if ($env:SOURCE_RUN_ID -notmatch '^[0-9]+$') { throw 'Invalid workflow run id.' }
          gh run download $env:SOURCE_RUN_ID --name NekoPak-signed-windows-x64 --dir fetched
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath fetched/dist -Destination dist -Recurse
          python scripts/release_signing.py verify --manifest dist/release-manifest.json --public release/release-signing.pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify files, shortcuts and removal
        shell: pwsh
        run: |
          $report = Get-Content -LiteralPath dist/size-report.json -Raw | ConvertFrom-Json
          ./scripts/test_installer.ps1 -Installer (Join-Path dist $report.installer.name)
