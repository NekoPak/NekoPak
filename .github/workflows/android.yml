name: Android preview checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install pinned Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --all --check
      - run: cargo fetch --locked
      - run: python -m unittest discover -s tests -p test_android_packaging.py
      - run: npm run tauri -- android init --ci --skip-targets-install
      - run: python scripts/android_project.py
      - run: npm run tauri -- android build --debug --target aarch64 --apk --ci
      - run: python scripts/package_android.py package --profile debug --abi arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: NekoPak-android-arm64-debug
          path: |
            dist/android/*-debug.apk
            dist/android/*-debug-licenses.zip
            dist/android/*-debug-report.json
          if-no-files-found: error
