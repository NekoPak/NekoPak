name: Windows desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      - run: python scripts/check_parity.py
      - if: startsWith(github.ref, 'refs/tags/parity-')
        run: python scripts/check_parity.py --release
      - run: python -m unittest discover -s tests -p test_parity.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p nekopak-core --example export_fixtures
      - run: cargo run --locked -p nekopak-provider-native --example export_fixture
      - run: git diff --exit-code -- tests/fixtures
      - run: npm run check
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run e2e
      - run: cargo run --locked -p nekopak-core --example mock_smoke
      - run: node scripts/gen-native-assets.mjs --check
      - run: cargo build --release --locked -p nekopak-desktop
      - run: cargo fetch --locked
      - run: python scripts/package_release.py
      - run: python scripts/package_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: NekoPak-windows-x64-integration
          path: |
            dist/*-portable.zip
            dist/*-setup.exe
            dist/size-report.json
          if-no-files-found: error
