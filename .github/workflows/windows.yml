name: Windows backend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p nekopak-core --example export_fixtures
      - run: git diff --exit-code -- tests/fixtures
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo run --locked -p nekopak-core --example mock_smoke
      - run: npm run tauri -- build --no-bundle
      - run: cargo fetch --locked
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: NekoPak-windows-x64-cli-preview
          path: dist/
