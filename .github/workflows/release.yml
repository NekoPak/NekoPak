name: Signed desktop release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version label (does not bypass feature-parity checks)
        required: true
        default: 0.1.0
  push:
    tags: ['v*', 'parity-*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm test
      - run: python scripts/check_parity.py
      - if: startsWith(github.ref, 'refs/tags/parity-')
        run: python scripts/check_parity.py --release
      - run: npm run tauri -- build --no-bundle
      - run: python scripts/package_release.py
      - run: python scripts/package_installer.py
      - run: python -m pip install cryptography==50.0.1
      - name: Sign and verify artifacts
        shell: pwsh
        env:
          NEKOPAK_RELEASE_PRIVATE_KEY: ${{ secrets.NEKOPAK_RELEASE_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if (-not $env:NEKOPAK_RELEASE_PRIVATE_KEY) { throw 'Release signing secret is missing.' }
          $report = Get-Content -LiteralPath dist/size-report.json -Raw | ConvertFrom-Json
          $archive = Join-Path dist $report.archive
          $installer = Join-Path dist $report.installer.name
          python scripts/release_signing.py sign $archive $installer --version $env:RELEASE_VERSION --output dist/release-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_signing.py verify --manifest dist/release-manifest.json --public release/release-signing.pub
      - uses: actions/upload-artifact@v4
        with:
          name: NekoPak-signed-windows-x64
          path: |
            dist/*-portable.zip
            dist/*-setup.exe
            dist/release-manifest.json
            dist/size-report.json
            release/release-signing.pub
          if-no-files-found: error
