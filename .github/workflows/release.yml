name: Signed desktop release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version label (does not bypass feature-parity checks)
        required: true
        default: 0.2.0
  push:
    tags: ['v*', 'parity-*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm test
      - run: python scripts/check_parity.py
      - if: startsWith(github.ref, 'refs/tags/parity-')
        run: python scripts/check_parity.py --release
      - run: node scripts/gen-native-assets.mjs --check
      - run: cargo build --release --locked -p nekopak-desktop
      - run: python scripts/package_release.py
      - run: python scripts/package_installer.py
      - run: python -m pip install cryptography==50.0.1
      - name: Sign and verify artifacts
        shell: pwsh
        env:
          NEKOPAK_RELEASE_PRIVATE_KEY: ${{ secrets.NEKOPAK_RELEASE_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if (-not $env:NEKOPAK_RELEASE_PRIVATE_KEY) { throw 'Release signing secret is missing.' }
          $report = Get-Content -LiteralPath dist/size-report.json -Raw | ConvertFrom-Json
          $archive = Join-Path dist $report.archive
          $installer = Join-Path dist $report.installer.name
          python scripts/release_signing.py sign $archive $installer dist/size-report.json --version $env:RELEASE_VERSION --output dist/release-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_signing.py verify --manifest dist/release-manifest.json --public release/release-signing.pub
      - uses: actions/upload-artifact@v4
        with:
          name: NekoPak-signed-windows-x64
          path: |
            dist/*-portable.zip
            dist/*-setup.exe
            dist/release-manifest.json
            dist/size-report.json
            release/release-signing.pub
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --all --check
      - run: cargo fetch --locked
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_android*.py'
      - run: python scripts/check_parity.py
      - if: startsWith(github.ref, 'refs/tags/parity-')
        run: python scripts/check_parity.py --release
      - run: npm run tauri -- android init --ci --skip-targets-install
      - run: python scripts/android_project.py
      - name: Build with the Android release signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/nekopak-android-release.jks"
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          python - <<'PY'
          import base64, os
          from pathlib import Path
          required = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Android release signing secrets are missing.')
          path = Path(os.environ['ANDROID_KEYSTORE_PATH'])
          with path.open('xb') as file:
              file.write(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
          npm run tauri -- android build --target aarch64 --apk --ci
      - run: python scripts/package_android.py package --profile release --abi arm64-v8a
      - run: python -m pip install cryptography==50.0.1
      - name: Sign and verify Android release manifest
        env:
          NEKOPAK_RELEASE_PRIVATE_KEY: ${{ secrets.NEKOPAK_RELEASE_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          python scripts/release_signing.py sign dist/android/*.apk dist/android/*-licenses.zip dist/android/*-report.json --version "$RELEASE_VERSION" --output dist/android/release-manifest.json
          python scripts/release_signing.py verify --manifest dist/android/release-manifest.json --public release/release-signing.pub
      - uses: actions/upload-artifact@v4
        with:
          name: NekoPak-signed-android-arm64
          path: |
            dist/android/*.apk
            dist/android/*-licenses.zip
            dist/android/*-report.json
            dist/android/release-manifest.json
            release/release-signing.pub
          if-no-files-found: error
  publish:
    needs: [windows, android]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.1
      - run: python -m unittest discover -s tests -p 'test_update_manifest.py'
      - uses: actions/download-artifact@v4
        with:
          name: NekoPak-signed-windows-x64
          path: fetched/windows
      - uses: actions/download-artifact@v4
        with:
          name: NekoPak-signed-android-arm64
          path: fetched/android
      - name: Verify installer before publication
        shell: pwsh
        run: |
          Copy-Item -LiteralPath fetched/windows/dist -Destination dist -Recurse
          python scripts/release_signing.py verify --manifest dist/release-manifest.json --public release/release-signing.pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -LiteralPath dist/size-report.json -Raw | ConvertFrom-Json
          ./scripts/test_installer.ps1 -Installer (Join-Path dist $report.installer.name)
      - name: Publish complete signed preview and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          NEKOPAK_RELEASE_PRIVATE_KEY: ${{ secrets.NEKOPAK_RELEASE_PRIVATE_KEY }}
        run: python scripts/publish_release.py --windows fetched/windows/dist --android fetched/android/dist/android --output dist/published --publish
