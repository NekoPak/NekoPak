[package]
name = "nekopak-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nekopak-domain.workspace = true
nekopak-provider.workspace = true
nekopak-provider-mock.workspace = true
nekopak-media.workspace = true
nekopak-mount.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["net"] }
rusqlite.workspace = true
time.workspace = true
uuid.workspace = true
sha2.workspace = true
sha1 = "0.10"
url.workspace = true
base64 = "0.22"
ring = "0.17.14"
semver = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "system-proxy", "socks"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile.workspace = true
async-trait.workspace = true

