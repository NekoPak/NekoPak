[package]
name = "nekopak-provider-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nekopak-domain.workspace = true
nekopak-provider.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "fs"] }
time.workspace = true
uuid.workspace = true
sha2.workspace = true
url.workspace = true
zeroize.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "system-proxy", "socks"] }
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
httpdate = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls-alpn"] }
native-tls = { version = "0.2", features = ["alpn"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"

[dev-dependencies]
tokio = { workspace = true, features = ["net", "test-util"] }
tempfile.workspace = true
