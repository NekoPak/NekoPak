[package]
name = "nekopak-desktop"
description = "NekoPak native desktop client (no WebView)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "nekopak"
path = "src/main.rs"

[features]
default = ["gpu"]
# OpenGL renderer with automatic fallback to the CPU renderer when no usable
# driver exists (remote desktop, VMs, old integrated graphics).
gpu = ["slint/renderer-femtovg"]
# Scripted UI driver and PNG screenshots for headless end-to-end tests.
automation = []

[dependencies]
# `unstable-winit-030` exposes window focus, system file drops and the extra
# mouse buttons; it may change between minor releases, hence the `~` pin.
slint = { version = "~1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030"] }
nekopak-core.workspace = true
nekopak-domain.workspace = true
nekopak-provider.workspace = true
nekopak-provider-mock.workspace = true
nekopak-provider-native.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true
uuid.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
open = "5"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
png = "0.18"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Globalization"] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
