[package]
name = "nekopak-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "nekopak-webview"

[lib]
name = "nekopak_app"
crate-type = ["staticlib", "cdylib", "rlib"]

# The desktop product is crates/nekopak-desktop (native UI, binary `nekopak`).
# This WebView host remains for Android and for web-UI development.
[[bin]]
name = "nekopak-webview"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.7"
nekopak-core.workspace = true
nekopak-domain.workspace = true
nekopak-provider.workspace = true
nekopak-provider-mock.workspace = true
nekopak-provider-native.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2.7"
jni = "0.21.1"
ndk-context = "0.1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

