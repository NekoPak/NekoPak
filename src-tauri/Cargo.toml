[package]
name = "nekopak-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "nekopak"

[[bin]]
name = "nekopak"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2.7"
nekopak-core.workspace = true
nekopak-domain.workspace = true
nekopak-provider.workspace = true
nekopak-provider-mock.workspace = true
nekopak-provider-native.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

